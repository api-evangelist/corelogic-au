- aid: corelogic-au:corelogic-au-psx-api
  name: CoreLogic Australia PSX API
  description: >-
    PSX is CoreLogic Australia's valuation ordering exchange, connecting lenders and brokers to
    panels of licensed valuers. The Cotality Developer Portal defines nine documented PSX
    operations — panel lookup, subscribe, pull notifications, expanded search, get order, update
    order, cancel, attach or retrieve documents, and set retrieved — plus a PSX implementation
    guide with quote, pre-ordering, ordering and valuation workflow diagrams. No base URL is
    published outside the authenticated portal, and no sample collection for PSX is public, so
    none is asserted here.
  humanURL: https://developer.corelogic.asia/apis/psx-apis/psx-get-order
  tags:
  - Valuation
  - Valuation Ordering
