- aid: corelogic-au:corelogic-au-content-api
  name: CoreLogic Australia Content API
  description: >-
    Serves the legal disclaimers that licensees are contractually required to display alongside
    CoreLogic data, retrieved by disclaimer key (for example /legal/disclaimers/auction_au and
    /legal/disclaimers/auction_standalone_au). It is also the host of the only anonymously
    readable machine-readable artifact CoreLogic Australia publishes: the RP.Inside authentication
    Postman collection at https://api.corelogic.asia/content/docs/public/deep-link-postman.json,
    fetched HTTP 200 on 2026-07-26. The production host probed anonymously on the same date and
    returned HTTP 401 "Access token is missing".
  humanURL: https://developer.corelogic.asia/apis
  baseURL: https://content.api.cotality.com.au
