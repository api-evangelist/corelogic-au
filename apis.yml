apis:
- aid: corelogic-au:corelogic-au-access-api
  name: CoreLogic Australia Access API
  description: >-
    OAuth 2.0 token service for every Cotality Australia and New Zealand API. Issues JWT access
    tokens via client_credentials, authorization_code and refresh_token grants. The developer
    portal documents POST https://access.api.cotality.com.au/as/token.oauth2 and
    POST https://access.api.cotality.com.au/oauth/token with HTTP Basic
    (base64 client_id:client_secret); the published sandbox collection shows the equivalent
    GET https://api.corelogic.asia/access/oauth/token?grant_type=client_credentials. Probed
    anonymously on 2026-07-26 and returned HTTP 401 unauthorized.
  humanURL: https://developer.corelogic.asia/guides/api-authentication
  baseURL: https://access.api.cotality.com.au
  tags:
  - Authentication
  - OAuth 2.0
  - JWT
  properties:
  - type: Documentation
    url: https://developer.corelogic.asia/guides/api-authentication
  - type: Documentation
    url: https://developer.corelogic.asia/guides/application-silent-login
  - type: PostmanCollection
    url: collections/corelogic-au-rp-inside-auth-example.postman_collection.json
  - type: PostmanCollection
    url: collections/corelogic-au-sample-sandbox.postman_collection.json
- aid: corelogic-au:corelogic-au-property-details-api
  name: CoreLogic Australia Property Details API
  description: >-
    Per-property record retrieval keyed on the CoreLogic property identifier — core and additional
    attributes, site detail, features, occupancy, sales history and last sale, on-the-market sales
    and rental campaigns, marketing contacts, and property photos. Thirteen operations are published
    in the CoreLogic APIs AU Sample Sandbox Collection under /au/properties/{propertyId}/*. Production
    host probed anonymously on 2026-07-26 and returned HTTP 401 "Access token is missing".
  humanURL: https://developer.corelogic.asia/apis
  baseURL: https://property-details.api.cotality.com.au
  tags:
  - Property Data
  - Property Records
  - Sales History
  - Rentals
  properties:
  - type: Documentation
    url: https://developer.corelogic.asia/apis
  - type: PostmanCollection
    url: collections/corelogic-au-sample-sandbox.postman_collection.json
- aid: corelogic-au:corelogic-au-property-services-api
  name: CoreLogic Australia Property Services API
  description: >-
    The older versioned property services family — comparables, geo sales search by polygon,
    locality, postcode and street, property and parcel suggest, point search, for-sale and for-rent
    advertisements, property pros-and-cons, marketing contacts, and property validation. Thirty-one
    operations are published in the sandbox collection under /au/v1/* and /au/v2/*. The collection
    references this family through unresolved Postman variables, so no production base URL is
    asserted here; the suggest and address-matcher hosts suggest.api.cotality.com.au and
    matcher.api.cotality.com.au both resolve and answered HTTP 401 on 2026-07-26.
  humanURL: https://developer.corelogic.asia/apis
  tags:
  - Property Search
  - Comparables
  - Geo Search
  - Address Matching
  properties:
  - type: Documentation
    url: https://developer.corelogic.asia/apis
  - type: PostmanCollection
    url: collections/corelogic-au-sample-sandbox.postman_collection.json
- aid: corelogic-au:corelogic-au-search-api
  name: CoreLogic Australia Search API
  description: >-
    Property search and address matching across Australia — radius search by latitude/longitude,
    and filtered search by council area, locality, postcode and street, each in four flavours
    (current attributes, last sale, on-the-market for rent, on-the-market for sale), plus the
    Address Matcher service that resolves a free-text address to a CoreLogic property identifier.
    Twenty-two operations are published in the sandbox collection. Production host probed
    anonymously on 2026-07-26 and returned HTTP 401 "Access token is missing".
  humanURL: https://developer.corelogic.asia/address_matcher
  baseURL: https://search.api.cotality.com.au
  tags:
  - Property Search
  - Address Matching
  - Geo Search
  - Property Listings
  properties:
  - type: Documentation
    url: https://developer.corelogic.asia/address_matcher
  - type: PostmanCollection
    url: collections/corelogic-au-sample-sandbox.postman_collection.json
- aid: corelogic-au:corelogic-au-avm-api
  name: CoreLogic Australia AVM API
  description: >-
    IntelliVal automated valuation model — the valuation engine at the centre of CoreLogic
    Australia's mortgage and lending business. The sandbox collection publishes consumer and
    origination AVM variants, current and historical point-in-time valuations
    (/au/properties/{id}/avm/intellival/{variant}/{date}), a live AVM POST
    (/liveavm/intellival/consumer) and a banded live AVM (/liveavm/intellival/consumer/band),
    with a roundTo parameter. Production host probed anonymously on 2026-07-26 and returned
    HTTP 401 "Access token is missing".
  humanURL: https://developer.corelogic.asia/apis
  baseURL: https://avm.api.cotality.com.au
  tags:
  - AVM
  - Valuation
  - Mortgage
  - IntelliVal
  properties:
  - type: Documentation
    url: https://developer.corelogic.asia/apis
  - type: PostmanCollection
    url: collections/corelogic-au-sample-sandbox.postman_collection.json
- aid: corelogic-au:corelogic-au-auction-api
  name: CoreLogic Australia Auction API
  description: >-
    Australian auction results and clearance rates — the weekly number the Australian property
    press runs on. Publishes state-level summaries and results with capital-city filtering,
    suburb and postcode detail, clearance-rate statistics, multi-week windows, date-range search
    and year-on-year comparison. Thirteen operations are published in the sandbox collection.
    Production host probed anonymously on 2026-07-26 and returned HTTP 401 "Access token is missing".
  humanURL: https://developer.corelogic.asia/apis
  baseURL: https://auction.api.cotality.com.au
  tags:
