aid: corelogic-au
url: https://raw.githubusercontent.com/api-evangelist/corelogic-au/refs/heads/main/apis.yml
name: CoreLogic Australia
kind: company
description: >-
  CoreLogic Australia — trading as Cotality since the 2025 global rebrand, and operating
  the RP Data platform through RP Data Pty Ltd — is the dominant independent property data,
  analytics and valuation provider in Australia and New Zealand. It sits in the middle of the
  Australian property value chain: it aggregates state land-registry and valuer-general records,
  agent and portal listing campaigns, auction results and rental campaigns into a single property
  spine, then sells that spine back to banks, mortgage brokers, valuers, insurers, agents and
  government. Its commercial products include the RP Data / RP Professional desktop, the IntelliVal
  automated valuation model, the CoreLogic Home Value Index, Cordell construction cost data,
  Cityscope commercial property data, and the PSX valuation ordering exchange. Its API posture is
  genuinely developer-facing but commercially licensed: a live Backstage-based Cotality Developer
  Portal at developer.corelogic.asia offers self-serve signup and self-serve creation of sandbox
  OAuth clients against a deliberately restricted evaluation dataset with request quotas, while every
  production API host in the *.api.cotality.com.au family answers 401 "Access token is missing"
  and requires a signed commercial data licence. Australia has no MLS and no RESO mandate — CoreLogic's
  RESO Web API and Data Dictionary certifications belong to Trestle, its United States MLS platform,
  not to this Australian surface. The Australian APIs are proprietary REST/JSON over an Apigee
  gateway with OAuth 2.0 client credentials; no OData $metadata, no RESO endpoint, and no RESO
  Universal Property Identifier appears anywhere in the Australian developer portal.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/corelogic-au.png
