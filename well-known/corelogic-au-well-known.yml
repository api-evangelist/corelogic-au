note: >-
  Two real /.well-known/ documents exist across the CoreLogic Australia / Cotality estate, both on
  the PingFederate identity host auth.corelogic.asia. Every *.api.cotality.com.au production host
  answers 401 "Access token is missing" to ANY path — including /.well-known/* — so a 401 there is
  a gate, not a 404, and no discovery surface can be read anonymously. The Backstage developer
  portal at developer.corelogic.asia is a single-page app that serves its HTML shell with HTTP 200
  for every unknown path; /.well-known/security.txt, /llms.txt, /.well-known/api-catalog and
  /.well-known/ai-plugin.json all returned 200 there but the body is <!DOCTYPE html>, so they are
  recorded as shell (not present). No security.txt exists anywhere on cotality.com,
  corelogic.asia or corelogic.com.au.
