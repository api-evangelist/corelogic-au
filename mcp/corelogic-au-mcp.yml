finding: 'The parent company launched a Cotality MCP Server on 31 March 2026 — a real product, built on
  the open Model Context Protocol, positioned as "the universal AI connector for property intelligence"
  and marketed as a bridge between ChatGPT / Claude / Gemini and Cotality''s property data core. It is
  recorded here because it is the company''s agent surface, but it is NOT an Australian surface: every
  data asset the product page lists is a United States dataset, the developer portal for the Australian
  and New Zealand APIs (developer.corelogic.asia) never mentions MCP, and no endpoint URL, tools/list
  manifest, transport, or authentication contract is published anonymously anywhere. Because of that,
  no `type: MCPServer` pointer is wired on this Australian repo — doing so would credit CoreLogic Australia
  with an agent surface it does not serve.'
