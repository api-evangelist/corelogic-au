  scopes: scopes/corelogic-au-scopes.yml
  errors: errors/corelogic-au-problem-types.yml
  lifecycle: lifecycle/corelogic-au-lifecycle.yml
  sandbox: sandbox/corelogic-au-sandbox.yml
