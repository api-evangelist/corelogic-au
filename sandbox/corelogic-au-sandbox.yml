docs: https://developer.corelogic.asia/guides/sandbox-test-data
summary: >-
  Cotality runs a genuinely self-serve sandbox for the Australian and New Zealand APIs — sign up on
  the developer portal, create a sandbox client at /apps/create, and call api-sbox.corelogic.asia
  with a client_credentials JWT. The environment is a real mirror of production, deliberately
  restricted: about 29,000 properties across 29 suburbs, three years of market trends, no legal
  content, and a request quota that returns 429 when exhausted. Everything below is published by
  the vendor verbatim; no test value here is invented.
access:
  self_serve: true
  signup: https://developer.corelogic.asia/signup
  create_client: https://developer.corelogic.asia/apps/create
  clients_page: https://developer.corelogic.asia/apps
  agreement: >-
    Click-through "Sandbox Environment Terms and Conditions" — a Licence Enabler pre-agreement
    covering confidentiality, IP, liability and Australian Privacy Act 1988 (Cth) / Australian
    Privacy Principles / Spam Act 2003 (Cth) / Do Not Call Register Act 2006 (Cth) obligations.
  verbatim: >-
    "Sandbox clients are limited to the sandbox environment with a restricted dataset and API
    request quota. Use these clients to develop your ideas and explore our APIs. This allows you to
    get a feel for our API experience before you progress to a test environment."
  secret_rotation: portal "Reset Client Secret" action
  client_removal: portal "Remove Client" action
  next_step: >-
    "An integration representative will contact you shortly to discuss pricing and provisioning a
    full-access, paid service plan."
separation:
  model: environment-scoped hosts and environment-bound tokens (no test/live key prefixes)
  sandbox_host: https://api-sbox.corelogic.asia
  uat_host_pattern: https://<service>.api-uat.cotality.com.au
  production_host_pattern: https://<service>.api.cotality.com.au
  token_endpoint_sandbox: https://api-sbox.corelogic.asia/access/as/token.oauth2
  cross_environment_error: >-
    401 "Invalid token provided." — a token generated in UAT can only be used in UAT.
  restricted_access_error: 401 "Restricted environment access denied."
quota:
  documented: true
  numeric_limit_published: false
  exhausted_response: 429 Too Many Requests
  verbatim: >-
    "This provides access to our Sandbox environment - a limited dataset and an API request quota.
    When the sandbox quota is exhausted the response will be '429 Too Many Requests'."
data_limits:
  properties_verbatim: >-
    "Our sandbox includes property-related data for a limited subset of properties. These properties
    are distributed across 29 suburbs (3 suburbs per state in Australia and 5 suburbs for New
    Zealand) with about 1,000 properties in each suburb."
  market_trends_verbatim: >-
    "Our sandbox also includes limited market trends data. This data includes geographic location
    types, including suburb, postcode, local government area and territory authority (in NZ). This
    data is limited to the past three years for the suburb, postcode, local government area and
    territory authority and one year for state and country. This data is sourced from the same 29
    suburbs used for property-related data."
  legal_content: >-
    Not available in sandbox — "Legal content is not available in the Sandbox environment. Once
    promoted to UAT you will be able to trial it."
excluded_api_collections:
- AVM - origination type
- Geospatial Services
- Property Monitor and Notification
- Property Owner Verification
- Update
excluded_note: >-
  "Our sandbox mirrors the APIs found on our UAT and production servers. However, our sandbox does
  not include the following API collections... You will be able to access these Services when we
  promote you to the UAT environment."
