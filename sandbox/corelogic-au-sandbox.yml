  The published "1. CoreLogic APIs AU Sample Sandbox Collection" leaves its host variables
  ({{avm}}, {{search}}, {{auction}}, {{charts}}, {{statistics}}, {{content}}, {{prop-details}},
  {{prop}}, {{propau}}, {{timeline}}) unresolved; set them to the api-sbox.corelogic.asia service
  roots listed above before running it.
