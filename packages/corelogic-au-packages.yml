finding: >-
  Cotality publishes NO first-party client library for the Australian or New Zealand APIs. The
  Cotality Developer Portal has no SDK page, no downloads section and no code-sample library beyond
  cURL snippets; its GitHub organisation (github.com/corelogic) has zero public repositories; and
  nothing named cotality exists on npm, PyPI, NuGet, RubyGems, Packagist or crates.io. The two
  Postman collections in collections/ are the only client-side integration assets the vendor
  ships. Everything listed below is third-party or belongs to the United States CoreLogic surface,
  and none of it is marked official.
